name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    env:
      SEEK_DATABASE_ENGINE: ${{ vars.SEEK_DATABASE_ENGINE }}
      SQLITE_DB_PATH: ${{ vars.SQLITE_DB_PATH }}
      SEEK_DATABASE_TABLE: ${{ vars.SEEK_DATABASE_TABLE }}

      POSTGRESQL_HOST: ${{ vars.POSTGRESQL_HOST }}
      POSTGRESQL_PORT: ${{ vars.POSTGRESQL_PORT }}
      POSTGRESQL_USER: ${{ vars.POSTGRESQL_USER }}
      POSTGRESQL_DATABASE: ${{ vars.POSTGRESQL_DATABASE }}
      POSTGRESQL_TABLE: ${{ vars.POSTGRESQL_TABLE }}

      POSTGRESQL_PASSWORD: ${{ vars.POSTGRESQL_PASSWORD }}

      # Optional explicit aliases (set if you use them in Environment vars)
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_TABLE: ${{ vars.POSTGRES_TABLE }}
      POSTGRES_PASSWORD: ${{ vars.POSTGRES_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up environment variables
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > infra/.env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> infra/.env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> infra/.env
          echo "HTTP_PROXY=${{ secrets.HTTP_PROXY }}" >> infra/.env
          echo "HTTPS_PROXY=${{ secrets.HTTPS_PROXY }}" >> infra/.env
          echo "AGG_AI_SYSTEM_PROMPT=${{ vars.AGG_AI_SYSTEM_PROMPT }}" >> infra/.env

      - name: Build and run containers
        run: |
          cd infra
          export IMAGE_NAME="jobs-app:${GITHUB_SHA}"
          docker compose down
          
          docker compose build
          docker compose up -d --remove-orphans

      - name: Show running containers
        run: docker ps

      - name: Verify database persistence
        run: |
          ls -lh /var/lib/jobs-app/data
          ls -lh /var/lib/jobs-app/data
          echo "✅ Database folder contents listed above"
