<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind CSS via CDN -->
  </head>
  <body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto p-4">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
        Job Decisions
      </h1>

      <!-- Table to display job data -->
      <div class="overflow-x-auto bg-white shadow-md rounded-lg">
        <table class="min-w-full table-auto">
          <thead class="bg-gray-800 text-white">
            <tr>
              <th class="px-6 py-3">Job Name</th>
              <th class="px-6 py-3">Company</th>
              <th class="px-6 py-3">Score</th>
              <th class="px-6 py-3">Is IT Role</th>
              <th class="px-6 py-3">Confidence</th>
            </tr>
          </thead>
          <tbody>
            {% for job in jobs %}
            <tr class="border-b">
              <td class="px-6 py-3">{{ job['job_title'] }}</td>
              <td class="px-6 py-3">{{ job['company_name'] }}</td>
              <td class="px-6 py-3">{{ job['score'] }}</td>
              <td class="px-6 py-3">{{ job['is_it_role'] }}</td>
              <td class="px-6 py-3">{{ job['confidence'] }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
