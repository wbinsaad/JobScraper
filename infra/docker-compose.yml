services:
  app:
    image: ${IMAGE_NAME:-jobs-app}
    build:
      context: ..
      dockerfile: ./Dockerfile
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    volumes:
      - /var/lib/jobs-app/data:/app/data
      - ../config.yaml:/app/config.yaml:ro
    environment:
      - FLASK_ENV=development
    depends_on:
      - migrate
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  seek_api:
    image: ${seek_api:-jobs-app-seek_api}
    build:
      context: ..
      dockerfile: ./seek_api/Dockerfile
    environment:
      DATABASE_ENGINE: ${SEEK_DATABASE_ENGINE:?SEEK_DATABASE_ENGINE is required}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-/app/data/seek_jobs.sqlite3}
      DATABASE_TABLE: ${SEEK_DATABASE_TABLE:?SEEK_DATABASE_TABLE is required}

      POSTGRESQL_HOST: ${POSTGRESQL_HOST:-${POSTGRES_HOST:-}}
      POSTGRESQL_PORT: ${POSTGRESQL_PORT:-${POSTGRES_PORT:-}}
      POSTGRESQL_USER: ${POSTGRESQL_USER:-${POSTGRES_USER:-}}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-${POSTGRES_PASSWORD:-}}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-${POSTGRES_DB:-}}
      POSTGRESQL_TABLE: ${SEEK_DATABASE_TABLE:-${SEEK_DATABASE_TABLE:?SEEK_DATABASE_TABLE is required}}

      POSTGRES_HOST: ${POSTGRES_HOST:-${POSTGRESQL_HOST:-}}
      POSTGRES_PORT: ${POSTGRES_PORT:-${POSTGRESQL_PORT:-}}
      POSTGRES_USER: ${POSTGRES_USER:-${POSTGRESQL_USER:-}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${POSTGRESQL_PASSWORD:-}}
      POSTGRES_DB: ${POSTGRES_DB:-${POSTGRESQL_DATABASE:-}}
      POSTGRES_TABLE: ${SEEK_DATABASE_TABLE:-${SEEK_DATABASE_TABLE:-${SEEK_DATABASE_TABLE:?SEEK_DATABASE_TABLE is required}}}
    ports:
      - "127.0.0.1:6059:8000"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - /var/lib/seek-app/data:/app/data
    restart: unless-stopped

  seek_scraper:
    image: ${seek_scraper:-jobs-app-seek_scraper}
    build:
      context: ..
      dockerfile: ./seek_scraper/Dockerfile
    container_name: seekspider-scheduler
    environment:
      DATABASE_ENGINE: ${SEEK_DATABASE_ENGINE:?SEEK_DATABASE_ENGINE is required}
      SQLITE_DB_PATH: ${SQLITE_DB_PATH:-/app/data/seek_jobs.sqlite3}
      DATABASE_TABLE: ${SEEK_DATABASE_TABLE:?SEEK_DATABASE_TABLE is required}

      POSTGRESQL_HOST: ${POSTGRESQL_HOST:-${POSTGRES_HOST:-}}
      POSTGRESQL_PORT: ${POSTGRESQL_PORT:-${POSTGRES_PORT:-}}
      POSTGRESQL_USER: ${POSTGRESQL_USER:-${POSTGRES_USER:-}}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD:-${POSTGRES_PASSWORD:-}}
      POSTGRESQL_DATABASE: ${POSTGRESQL_DATABASE:-${POSTGRES_DB:-}}
      POSTGRESQL_TABLE: ${SEEK_DATABASE_TABLE:-${SEEK_DATABASE_TABLE:?SEEK_DATABASE_TABLE is required}}

      POSTGRES_HOST: ${POSTGRES_HOST:-${POSTGRESQL_HOST:-}}
      POSTGRES_PORT: ${POSTGRES_PORT:-${POSTGRESQL_PORT:-}}
      POSTGRES_USER: ${POSTGRES_USER:-${POSTGRESQL_USER:-}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${POSTGRESQL_PASSWORD:-}}
      POSTGRES_DB: ${POSTGRES_DB:-${POSTGRESQL_DATABASE:-}}
      POSTGRES_TABLE: ${SEEK_DATABASE_TABLE:-${SEEK_DATABASE_TABLE:-${SEEK_DATABASE_TABLE:?SEEK_DATABASE_TABLE is required}}}

      SCHEDULER_TIMEZONE: Australia/Melbourne
      WEEKDAY_SCHEDULE_TIMES: "08:07,10:02,12:13,14:06,16:07,18:31,22:09"
      WEEKEND_SCHEDULE_TIMES: "09:41,14:37,17:31,21:51"
      SPIDER_NAME: seek
      SPIDER_ARGS: "region=Melbourne"
      SCRAPY_BIN: scrapy
      SCRAPY_PROJECT_DIR: /app
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RUN_ON_START: "true"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - /var/lib/seek-app/data:/app/data
    restart: unless-stopped

  migrate:
    image: ${IMAGE_NAME:-jobs-app}
    depends_on: []
    working_dir: /app
    command: ["python", "infra/migrate.py"]
    volumes:
      - /var/lib/jobs-app/data:/app/data
      - ../config.yaml:/app/config.yaml:ro
    environment:
      # DB path used by migrate.py (if it reads from config, this may be unnecessary)
      DB_PATH: /app/data/jobs.db
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  scraper:
    image: ${IMAGE_NAME:-jobs-app}
    depends_on:
      - migrate
    working_dir: /app
    command: ["python", "-m", "scraper.main", "serve", "--config", "/app/config.yaml"]
    restart: unless-stopped
    volumes:
      - /var/lib/jobs-app/data:/app/data
      - ../config.yaml:/app/config.yaml:ro
    environment:
      # optional proxy envs (forward only if used)
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  matcher:
    image: ${IMAGE_NAME:-jobs-app}
    depends_on:
      - migrate
    working_dir: /app
    command: ["python", "matcher/main.py", "--config", "/app/config.yaml"]
    restart: unless-stopped
    volumes:
      - /var/lib/jobs-app/data:/app/data
      - ../config.yaml:/app/config.yaml:ro
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?set in .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set in .env}
      # If you use proxies for matcher:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"