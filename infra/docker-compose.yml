version: "3.9"

services:
  scraper:
    build:
      context: ..
      dockerfile: scraper/Dockerfile
    container_name: Linkedin-scraper
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    volumes:
      # DB & backups live here on the host
      - ../data:/app/data
      # mount your YAML config into the container
      - ../config.yaml:/app/config.yaml:ro
    # optional healthcheck (only if you add a tiny /healthz later)
    # healthcheck:
    #   test: ["CMD", "curl", "-fsS", "http://localhost:8090/healthz"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 5
